# Fallback resolvers used only when no per-link DNS servers are configured
# at all. Without this, a machine whose network stack isn't yet feeding
# resolved real DNS servers (e.g. still on NetworkManager, or iwd/networkd
# not fully applied until the next reboot) has zero resolvers the moment
# /etc/resolv.conf points at resolved's stub — breaking name resolution
# right before AUR builds and the custom package phase need to `git clone`.
[Resolve]
FallbackDNS=1.1.1.1 9.9.9.9 8.8.8.8
