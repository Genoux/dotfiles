# Disables debug package generation. Installed to /etc/makepkg.conf.d/, which
# makepkg sources after makepkg.conf (/usr/share/makepkg/util/config.sh)
# — arrays are replaced wholesale there, not merged, so this must restate the
# full OPTIONS array (Arch default as of /etc/makepkg.conf.pacnew) rather than
# just the one flag. Editing /etc/makepkg.conf directly with sed is what
# caused it to accumulate "!!!debug" on repeated installer runs; this file
# is idempotent because it is always installed verbatim, never patched.
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug lto)

# Budget 2 GiB per build job so small laptops do not exhaust RAM.
_dotfiles_build_jobs=$(awk '/MemTotal:/ {jobs = int($2 / 2097152); print (jobs > 0 ? jobs : 1)}' /proc/meminfo)
_dotfiles_build_cpus=$(nproc)
(( _dotfiles_build_jobs > _dotfiles_build_cpus )) && _dotfiles_build_jobs=$_dotfiles_build_cpus
MAKEFLAGS="-j$_dotfiles_build_jobs"
CMAKE_BUILD_PARALLEL_LEVEL=$_dotfiles_build_jobs
CARGO_BUILD_JOBS=$_dotfiles_build_jobs
export MAKEFLAGS CMAKE_BUILD_PARALLEL_LEVEL CARGO_BUILD_JOBS
unset _dotfiles_build_jobs _dotfiles_build_cpus
