name = "packages"
name_pretty = "Package Management"
fixed_order = true
icon = "system-software-install"

[[entries]]
icon = "list-add-symbolic"
text = "Install Package (Official)"
actions = { install = "ghostty --class=tui.package-manager -e system-package-install" }

[[entries]]
icon = "list-add-symbolic"
text = "Install Package (AUR)"
actions = { install_aur = "ghostty --class=tui.package-manager -e system-package-install-aur" }

[[entries]]
icon = "list-remove-symbolic"
text = "Remove Package"
actions = { remove = "ghostty --class=tui.package-manager -e system-package-remove" }

