# Opt-in Codex profile that routes through the local 9router gateway:
#   codex --profile ninerouter
#
# Codex 0.153 reads profiles from ~/.codex/<name>.config.toml rather than a
# [profiles.*] table in config.toml, and it resolves model_providers declared
# here too. That keeps the whole gateway wiring in this one portable file and
# leaves config.toml free of anything but machine-local hook hashes and project
# trust entries.

model_provider = "ninerouter"
model = "cc/claude-opus-4-7"

[model_providers.ninerouter]
name = "9Router"
base_url = "http://localhost:20128/v1"
env_key = "NINEROUTER_API_KEY"
# Codex removed the chat wire protocol in Feb 2026 and hard-fails at config
# load on wire_api="chat", even for unused providers. 9router serves
# /v1/responses, verified by probe.
wire_api = "responses"
