# Opt-in Codex profile that routes through the local 9router gateway:
#   codex --profile ninerouter
#
# Codex 0.153 reads profiles from ~/.codex/<name>.config.toml rather than a
# [profiles.*] table in config.toml, and it resolves model_providers declared
# here too. That keeps the whole gateway wiring in this one portable file and
# leaves config.toml free of anything but machine-local hook hashes and project
# trust entries.
#
# No model is set on purpose, so this profile fails loudly until a provider is
# chosen deliberately. 9router's only Claude namespace is cc/, which is a Claude
# Code *subscription* OAuth session: Anthropic licenses those for its own
# clients, not for proxying, and 9router's dashboard warns that using one this
# way risks the account. There is no Anthropic API-key provider in 9router at
# all, so no clean Claude route exists through the gateway — run Claude Code
# directly against Anthropic instead.
#
# To use this profile, connect an API-key provider in the dashboard and set a
# model from its namespace (openai/, gemini/, xai/, groq/, mistral/, ...):
# model = "openai/gpt-5.4"

model_provider = "ninerouter"

[model_providers.ninerouter]
name = "9Router"
base_url = "http://localhost:20128/v1"
env_key = "NINEROUTER_API_KEY"
# Codex removed the chat wire protocol in Feb 2026 and hard-fails at config
# load on wire_api="chat", even for unused providers. 9router serves
# /v1/responses, verified by probe.
wire_api = "responses"
